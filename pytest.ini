[pytest]
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -vs --alluredir=./report/allure --clean-alluredir
markers =
    user: user module tests
    lostfound: lost and found module tests
    forum: forum module tests
    im: instant messaging module tests
    news: news module tests
    home: home module tests
    admin: admin-only tests
    smoke: smoke tests
    p0: priority 0 tests
    p1: priority 1 tests
    p2: priority 2 tests
